host_timer_resolution_ms_tip = "Avec quelle précision l'horloge audio du jeu peut tourner.\n\n\"Hôte\" laisse le minuteur du système tel quel, trop grossier pour ce jeu : tout ce que pilote l'horloge audio tourne environ 3 fois trop lentement.\n\n\"Xbox 360\" reproduit la console : musique et voix suivent le tempo prévu, et les répliques sont suivies d'une courte pause avant la suivante, comme sur le matériel d'origine.\n\n\"Instantané\" garde ce tempo mais passe à la réplique suivante dès que la courante se termine, ce qui supprime ces pauses. Affaire de goût ; cela consomme plus et peut faire tourner les ventilateurs."
