field_action_default_model_tip = "Verwendet vorübergehend das Modell der Story-Figur für Truhen, Türen, Klettern und andere Feldanimationen. Ausschalten, um das gewählte Modell zu behalten, das sich verrenken kann, weil diese Animationen ein inkompatibles Skelett nutzen."
