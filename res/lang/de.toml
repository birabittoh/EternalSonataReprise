field_leader_model_tip = "Welche Figur auf der Oberwelt herumläuft.\n\n\"Gruppenanführer\" nimmt den Ersten der Gruppe, den du im Statusmenü umsortierst.\n\nDas Modell lässt sich nur bei pausiertem Feld tauschen, daher gilt eine Änderung beim nächsten Schließen eines Menüs oder Gebietswechsel. Figuren, deren Modell noch nicht geladen ist, verwenden das Standardmodell."
