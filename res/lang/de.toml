host_timer_resolution_ms = "Audio-Timing"
host_timer_resolution_ms_tip = "Wie genau die Audiouhr des Spiels laufen darf.\n\n\"Host\" lässt den Systemtimer unberührt, der für dieses Spiel zu grob ist: alles, was die Audiouhr antreibt, läuft etwa 3x zu langsam.\n\n\"Xbox 360\" entspricht der Konsole: Musik und Stimmen laufen im vorgesehenen Tempo, und nach gesprochenen Zeilen folgt eine kurze Pause, genau wie auf der Originalhardware.\n\n\"Sofort\" behält das Tempo, springt aber zur nächsten Zeile, sobald die aktuelle endet, und kürzt so diese Pausen. Geschmackssache; es braucht mehr Strom und kann die Lüfter hochdrehen."
