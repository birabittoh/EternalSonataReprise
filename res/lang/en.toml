host_timer_resolution_ms = "Audio Timing"
host_timer_resolution_ms_tip = "How precisely the game's audio clock is allowed to run.\n\n\"Host\" leaves your system's own timer alone, which is too coarse for this game and makes everything the audio clock drives run about 3x slow.\n\n\"Xbox 360\" matches the console: music and voices play at the tempo they were written for, and spoken lines are followed by a short pause before the next one, exactly as they were on the original hardware.\n\n\"Instantaneous\" keeps that same tempo but moves on to the next line as soon as the current one finishes, trimming those pauses. Down to taste; it draws more power and can spin fans up."
