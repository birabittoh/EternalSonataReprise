# The game's image loader (sub_82279EC8) probes formats using setjmp/longjmp:
# sub_822783A8 does setjmp(sub_822D0970) around a decode, and on a format mismatch
# the JPEG reader's error handler (sub_822764D0) calls longjmp (sub_822D0620) to
# bail out so the loop can try the next format (PNG). The recompiler only handles
# these non-local jumps correctly when told the setjmp/longjmp addresses; without
# them longjmp fell through an epilogue-less handler, leaking guest r1 and
# corrupting callee-saved registers -> boot crash in sub_8228C860.
setjmp_address = 0x822D0970
longjmp_address = 0x822D0620

[functions]
"0x8228D440" = {}

# ============================================================================
# memmove_s is intentionally absent: this title links memcpy_s but no standalone
# 4-arg memmove_s -- every memmove caller is game code or an unrelated struct-arg
# secure/locale routine, so there is no correct target to map.
# ============================================================================
[rexcrt]
memcpy   = 0x822CF5B0
memmove  = 0x822CE550
memset   = 0x822CFB40
memcpy_s = 0x822D5748
XMemCpy  = 0x822530B8

# ============================================================================
# Twelve characters, hand-written half
#
# The game ships ten characters and the per-character arrays are exactly ten
# wide with no padding anywhere. Raising the cast to twelve takes four things,
# and this file holds all of them:
#
#   1. relocate the cold arrays so the hot ones can grow into the space
#      -> the generated block at the end of this file, src/party_relocation.*
#   2. teach the loops and range checks to count past ten
#      -> src/party_counts.cpp, below
#   3. carry the two new characters through the save
#      -> src/party_save.cpp, below
#   4. stop the two id gates rejecting them
#      -> src/party_bounds.cpp, below
#
# The hooks below are hand-written because, unlike the relocation sites, they
# are not one uniform shape. Each block names the C++ file that implements it;
# every one of those files carries the same table in its header comment.
#
# Three shapes recur. `li rX, 0xA` is a trip count, rewritten after the fact.
# `cmpwi rX, 0xA` cannot be rewritten, so the hook fires *before* the compare
# and takes the branch itself via jump_address_on_true for the extended range,
# leaving the original instruction to handle the first ten. And a few sites have
# no instruction to hook at all, where the fix is a store the game never makes.
# ============================================================================

# --- src/party_counts.cpp: the loops that count to ten ----------------------

# `li r10, 0xA` feeding mtctr for sub_821E5A38's ten-byte slotbytes clear.
[[midasm_hook]]
address = 0x821E5C10
name = "PartyCount_Twelve"
registers = ["r10"]
after_instruction = true

# The same clear in the sibling reset path sub_821E5D68.
[[midasm_hook]]
address = 0x821E5DCC
name = "PartyCount_Twelve"
registers = ["r11"]
after_instruction = true

# sub_821E7138's character init loop, which builds every character's stats from
# the (relocated) template table.
[[midasm_hook]]
address = 0x821E7190
name = "PartyCount_Twelve"
registers = ["r21"]
after_instruction = true

# sub_821E7358's two clear loops, over the pending-award queue's two halves.
[[midasm_hook]]
address = 0x821E7628
name = "PartyCount_Twelve"
registers = ["r10"]
after_instruction = true

[[midasm_hook]]
address = 0x821E7648
name = "PartyCount_Twelve"
registers = ["r10"]
after_instruction = true

# Both reset paths clear the position array as ten individual stw's rather than
# as a loop, so entries 11 and 12 -- which live in the bytes the relocated
# slotbytes array vacated -- would keep whatever the old slotbytes clear left
# behind, and read as two extra party members. There is no instruction to
# rewrite here; the hook stores the two missing zeroes itself.
#
# Those two hooks are NOT declared here. Each reset path follows its last
# position store with a `stb` into the relocated slotbytes array, whose base
# register has to be shifted by a hook on that same store. One address holds one
# hook, so the two jobs are merged into
# PartyCount_ClearPositionTail_ShiftSlotbytes and emitted by
# scripts/party_relocation_emit.py, in the generated block at the end of this
# file, at 0x821E5AA0 and 0x821E5DB4.

# `cmpwi rX, 0xA` / `blt` at the top of the two scans over the pending-award
# queue. Jumping on true re-enters the loop for the two new slots.
[[midasm_hook]]
address = 0x821E7690
name = "PartyCount_QueueScan"
registers = ["r31"]
jump_address_on_true = 0x821E767C

[[midasm_hook]]
address = 0x821E7EB0
name = "PartyCount_QueueScan"
registers = ["r30"]
jump_address_on_true = 0x821E7E9C

# `cmpwi r11, 0xA` / `bgt` rejecting character ids above ten on the award path.
# A real id range check, distinct from the two in party_bounds.cpp below.
[[midasm_hook]]
address = 0x821E76F4
name = "PartyCount_ExtendedId"
registers = ["r11"]
jump_address_on_true = 0x821E76FC

# sub_821DD808 picks a party HUD layout by member count and has arms for <=3,
# <=6, <=9 and ==10 only. Eleven or twelve fall out of the chain and the function
# returns having emitted no layout -- and therefore no 0xFFFF terminator for the
# command list, which makes sub_821F2F38 dispatch forever. This takes the
# ten-member arm for the two new counts. 0x821DD948 is the `bne`'s own
# fall-through, i.e. the head of that arm.
[[midasm_hook]]
address = 0x821DD940
name = "PartyCount_LayoutTen"
registers = ["r27"]
jump_address_on_true = 0x821DD948

# --- src/party_save.cpp: characters 11 and 12 in the save file --------------

# The save is a list of (ptr, size) blocks, not a fixed struct, and the game
# already gates a trailing block on its own save version. So the version goes
# from 2 to 3 and two 96-byte side-car blocks are appended, rather than widening
# the four 480-byte stat blocks, whose every following offset is a baked
# immediate. A retail version-2 save still loads; a version-3 save is 192 bytes
# larger than retail expects and retail cannot read it. That trade is accepted.

# sub_82241190 (write): `li r10, 2`, stored into the save header 28 bytes later.
[[midasm_hook]]
address = 0x822414D0
name = "PartySave_BumpVersion"
registers = ["r10"]
after_instruction = true

# sub_82241190 (write): after the last block the writer registers for itself and
# before it builds sub_8223DF80's arguments. r28 is the block-list descriptor.
[[midasm_hook]]
address = 0x82241674
name = "PartySave_AppendWriteBlocks"
registers = ["r28"]

# sub_82241190 (write): the `addi r8, r8, 0x5B98` completing the baked total-size
# constant. The two appended blocks have to be counted in it.
[[midasm_hook]]
address = 0x82241698
name = "PartySave_GrowTotalSize"
registers = ["r8"]
after_instruction = true

# sub_822404E8 (load): loc_82240600, the join point right after the loader's own
# version-2 conditional block. r30 is the descriptor; r29 points at the header
# pointer whose +0x18 is the version, which the hook checks before appending.
[[midasm_hook]]
address = 0x82240600
name = "PartySave_AppendLoadBlocks"
registers = ["r30", "r29"]

# The 2324-byte block at 0x8243F3E8 is copied as one span and contains the
# position and slotbytes arrays, both of which moved. The span cannot be
# redirected -- most of it never moved -- so these two carry the two arrays
# across it. See the comment above the hook bodies in src/party_save.cpp.

# sub_82240AF8 (load): after the `bl sub_822CF5B0` that restores the block.
[[midasm_hook]]
address = 0x82240b28
name = "PartySave_LoadPartyBlock"
after_instruction = true

# sub_82241190 (write): on the `mr r3, r20` before the matching `bl`, so the
# block captures the live arrays. The `bl` itself already carries no hook, but
# one address holds one hook, and putting this on the call would run it after
# the copy had already read the stale bytes.
[[midasm_hook]]
address = 0x82241278
name = "PartySave_StorePartyBlock"
after_instruction = true

# And once the copy has been taken, put the staging bytes back under the canary.
[[midasm_hook]]
address = 0x8224127c
name = "PartySave_StorePartyBlockDone"
after_instruction = true

# --- src/party_bounds.cpp: the id gates --------------------------------------

# sub_821E7898, the stat recompute every status and equipment screen depends on.
# Returns immediately unless 1 <= id <= 10; jumping past the compare lands on
# the body. cr6 is dead across the skip (the next reader is the bne at
# 0x821E78F4, whose own fcmpu is at 0x821E78F0).
[[midasm_hook]]
address = 0x821E78AC
name = "PartyBounds_ExtendedId"
registers = ["r11"]
jump_address_on_true = 0x821E78B4

# sub_821A03D0, the battle-party model loader. Rejects `id - 1 > 9` before it
# formats "btldata\player\pc%03d.bop", which is what an asset mod supplies
# pc011.bop and pc012.bop for. cr6 is dead across the skip too: the accept path
# calls sub_822CC8B0 immediately.
[[midasm_hook]]
address = 0x821A0528
name = "PartyBounds_ExtendedIndex"
registers = ["r11"]
jump_address_on_true = 0x821A0530

# sub_820E78B8, the party menu's "give a character the next free display
# position" routine (called by the mod API to add a member). Gates the 0-based
# index on `cmplwi r11, 9`; indices 10 and 11 (characters 11 and 12) fail the
# compare and the placement is silently skipped, which is exactly how "add to
# party" on those two looks like nothing happened. Jumping past the compare
# lands on the body. cr6 is dead across the skip: the body's first cr6 reader
# is the `bne` at 0x820E78F0, whose own `cmpwi` is at 0x820E78EC.
[[midasm_hook]]
address = 0x820E78D0
name = "PartyBounds_ExtendedIndex"
registers = ["r11"]
jump_address_on_true = 0x820E78D8

# sub_821A03D0 again, on the accept path (which is also where the model
# loader's gate above jumps to). r6 is still the character id and is the
# "%03d" argument sub_822CC8B0 formats, so this is where a mod-defined slot's
# model_id replaces it. Retail ids are never remapped.
[[midasm_hook]]
address = 0x821A0530
name = "PartyBounds_ModelId"
registers = ["r6"]

# sub_821BD0D0, the battle voice path builder ("btldata\voice\pc%03d.csf"),
# reached from the battle-party rebuild whenever a member becomes active.
# Rejecting an id here is not harmless: the caller sub_821BD1C0 has already
# freed the party slot's model object by this point and returns without
# replacing it, so the engine's task list keeps a released node and the next
# frame's dispatcher calls through a dead vtable. The hook sits on the `bgt`
# rather than on its `cmplwi` because the instructions between them zero a
# local struct the accept path uses. r10 is `id - 1`; r29 is the id, and is the
# "%03d" argument, so the hook remaps it the way the model loader does.
[[midasm_hook]]
address = 0x821BD110
name = "PartyBounds_VoiceId"
registers = ["r10", "r29"]
jump_address_on_true = 0x821BD114

# sub_821A2B38, the field character's model setup. `addi r11, r11, -1` /
# `cmplwi r11, 9` / `bgt` / `bctr` is a ten-entry jump table, one arm per retail
# character, and each arm fills in the descriptor the field object is built
# from. An added character falls past it and gets an object with no model, which
# is what the engine task list is still holding when the memory is recycled -
# the crash after making an added character the party leader. Remapping the id
# one instruction before the subtract sends it down its borrowed character's arm
# instead. r11 is the character id here.
[[midasm_hook]]
address = 0x821A2C84
name = "PartyBounds_FieldModelId"
registers = ["r11"]

# Diagnostics. The early returns that leave a freed party-slot object linked
# into the engine's task list, which is the shape of the dispatcher crash (and
# softlock) in sub_82132A08. Log only; they change no register and take no
# branch. Each names the character and the asset path, which is the difference
# between "this port gated it wrong" and "that file is missing".
#
# Both callers format the path into r1 + 0x60. r11 is first in every list
# because a mid-ASM hook fires before its instruction whether or not the branch
# is taken: all three sites are `clrlwi. r11, r3, 24` / `beq`, so the hook has
# to re-test r11 itself or it reports a bail-out on every ordinary pass.

# The voice path was built and the file behind it would not load.
[[midasm_hook]]
address = 0x821BD334
name = "PartyTrace_FieldModelLoadFailed"
registers = ["r11", "r1", "r29"]

# The path was never built: sub_821BD0D0's gate refused the id. Same bail-out,
# opposite cause, so it gets its own line.
[[midasm_hook]]
address = 0x821BD320
name = "PartyTrace_FieldVoicePathRejected"
registers = ["r11", "r29"]

[[midasm_hook]]
address = 0x821A0578
name = "PartyTrace_BattleModelLoadFailed"
registers = ["r11", "r1", "r29"]

# --- src/party_ui_guard.cpp: the menu draw walk -----------------------------

# sub_82160DC8, the menu node's child walk. r31 holds the record sub_82176CD8
# just returned for the child, and the next instruction reads flags out of it
# without checking for 0. A child added with the handle -1 - which is what the
# status screen does for the added character - has no record, so the load
# faults on guest address 4. Jumping to 0x82160EE0 takes the walk's own
# per-child exit, the one the flag test this load feeds already branches to.
[[midasm_hook]]
address = 0x82160E70
name = "PartyUi_MissingChild"
registers = ["r31"]
jump_address_on_true = 0x82160EE0

