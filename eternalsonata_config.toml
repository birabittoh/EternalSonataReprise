# ============================================================================
# PHASE 3: VTABLE SLOT 0 DESTRUCTORS (23 functions from 22 vtables)
#
# VERIFIED: these are all vtable slot 0 entries, i.e. destructors, not
# constructors. Every one was decompiled and shows the same shape: store the
# class vtable, tear down sub-objects, then overwrite the vtable with the OBJECT
# base (off_82082B60) and call sub_8212DDA8. Those taking a char flag are the
# deleting variants (the flag gates a final sub_82113FD0 free of `this`).
#
# NOT VERIFIED: the CLASS NAMES. The classes are real (they all appear in
# ps3/classes_rtti.txt, which is a genuine RTTI dump; its offsets are uniformly
# 0x10000 low and include the _ZTS length prefix), but the address-to-class
# assignment does not hold up:
#
#  * The Action/Param addresses ascend monotonically while matching the RTTI
#    list's alphabetical order exactly. That is two sorted lists zipped
#    together, not evidence.
#  * Two assignments in this block were already disproved by vtable identity
#    (OP_CREDIT_TASK, ED_CREDIT_TASK) and one by a duplicate vtable
#    (BW_DRAW_ICON).
#  * For the queue managers there was no signal to match on at all. On PS3 the
#    C2dCanvasQueueManager and CLightQueueManager destructors are byte-for-byte
#    the same shape, differing only in which TOC constant they load, so they
#    cannot anchor distinct 360 functions. On the 360 side neither vtable's
#    constructor copies a name literal, so there is no string anchor either.
#  * Concretely, off_82087530 (called CLightQueueManager here) is constructed
#    inline in sub_821F09A0 as a 104 byte object with x/y position and scale,
#    placed by sub_821F66C8 and registered with 2D draw calls: a per item 2D
#    element, not a light manager. off_8208754C (called C2dCanvasQueueManager)
#    is the one with a 384 slot handle table, which is what actually looks like
#    a manager. The names appear shifted within the family.
#
# So only the two whose class is pinned by vtable identity stay enabled. The
# rest are commented out: the address and the destructor finding are preserved
# as a worklist, the unfounded class name is not emitted. To restore one, tie
# its vtable to a constructor that names itself, then add an `evidence` field.
# ============================================================================

# 0x82131758 / 0x82131908 install vtables off_820831F8 / off_82083200, which the
# verified OP_CREDIT_TASK / ED_CREDIT_TASK constructors above also install. That
# pins the class independently of the RTTI guesswork.
"0x82131758" = { name = "OP_CREDIT_TASK__destructor_deleting", evidence = "installs off_820831F8, same vtable as the verified OP_CREDIT_TASK ctor at 0x82131668" }
"0x82131908" = { name = "ED_CREDIT_TASK__destructor_deleting", evidence = "installs off_82083200, same vtable as the verified ED_CREDIT_TASK ctor at 0x821317F8" }

