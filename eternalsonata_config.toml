# Was "tree_find". Verified wrong: it is a hash table insert/remove, not a tree
# and not a pure lookup. It hashes a name, walks a bucket chain (next at +24,
# prev at +20), then inserts a 32 byte entry when a3 is non null or unlinks the
# entry when a3 is zero, all under a lock.
"0x8210F050" = { name = "named_hashtable__SetEntry", evidence = "bucket chain walk + insert/unlink on a3, locked by sub_82109618/sub_82109670" }

# Was "dynamic_named_object__Init". Verified wrong: it strncpy's a 0x104 (MAX_PATH)
# string into a global and sets a flag. It is the {BeginCaptureFileCreation}
# handler in the PIX command table at 0x8226F450.
"0x8226F3B0" = { name = "PIX__SetCaptureFileName", evidence = "handler entry in the 0x8226F450 PIX command table; copies MAX_PATH name to byte_82426C80" }
# Was "pix_capture_logger". Verified wrong: it is the PIX command dispatcher. It
# builds a table of 8 command strings ({Connect}, {Disconnect}, {Version},
# {LimitCaptureSize}, {BeginCaptureFileCreation}, {EndCaptureFileCreation},
# {BeginCapture}, {EndCapture}) each paired with a handler, matches the input
# against them, invokes the handler, and reports "PIX!OK" or "PIX!NO".
"0x8226F450" = { name = "PIX__DispatchCommand", evidence = "8 entry command string/handler table, returns PIX!OK or PIX!NO" }
# Was "object_instance_factory". Verified wrong: it allocates via sub_822D1200,
# and on failure sets error code 63 plus an error string, then populates a three
# entry callback table at a2[0..2]. A callback table installer, not a factory.
"0x822985C0" = { name = "callback_table__Install", evidence = "fills a2[0..2] with sub_82298488/sub_82298520/sub_822985B8; error path sets code 63" }

