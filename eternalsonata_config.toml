# The game's image loader (sub_82279EC8) probes formats using setjmp/longjmp:
# sub_822783A8 does setjmp(sub_822D0970) around a decode, and on a format mismatch
# the JPEG reader's error handler (sub_822764D0) calls longjmp (sub_822D0620) to
# bail out so the loop can try the next format (PNG). The recompiler only handles
# these non-local jumps correctly when told the setjmp/longjmp addresses; without
# them longjmp fell through an epilogue-less handler, leaking guest r1 and
# corrupting callee-saved registers -> boot crash in sub_8228C860.
setjmp_address = 0x822D0970
longjmp_address = 0x822D0620

[functions]
"0x8228D440" = {}

# Names recovered from the PS3 build's RTTI table (ps3/classes_rtti.txt) and
# transferred to the Xbox 360 build by string anchoring. The 360 build has no
# RTTI, so every entry below is backed by a literal string the two builds share.
# Each was re-verified by decompilation.
# 0x822CCDB0 was named NAMEABLE_ITEM__SetName here. It is really strncpy, so it
# now lives in the [rexcrt] table at the bottom of this file and gets a native
# host implementation. Everything below that was justified as "calls SetName" is
# really just "calls strncpy"; see the warning on the batch 2-9 block.
"0x820CF140" = { name = "TEXTURE_LOT__GetInstance", evidence = "verified: lazy singleton on dword_82440564, allocates 112 bytes and tags it \"local alloc for texlot\"" }
# Verified genuine constructors by decompilation: both zero their fields, load a
# model, and SetName themselves with the matching literal. Their vtables
# (off_820831F8, off_82083200) pair them with the destructors in the Phase 3
# block below.
"0x82131668" = { name = "OP_CREDIT_TASK__ctor", evidence = "verified: zeroes its fields, loads op.bmd, installs vtable off_820831F8, names itself \"OP_CREDIT_TASK\" at +8" }
"0x821317F8" = { name = "ED_CREDIT_TASK__ctor", evidence = "verified: same shape, installs vtable off_82083200, names itself \"ED_CREDIT_TASK\" at +8" }
"0x82133130" = { name = "TITLE_TASK__Init", evidence = "verified: loads title.bmd, sets up the title camera and fade, names itself \"TITLE_TASK\" at +8" }

