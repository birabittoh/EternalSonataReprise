# Guest logic the PS3 target needs (ps3_buttons.cpp).

# Layout pass sub_821D5CC0 lays out PS3 button icons (code 25) as the code
# 24 arrows are, as part of the line's glyphs.
[[midasm_hook]]
address = 0x821D6BB8
name = "EternalSonataPs3IconCase"
registers = ["r25", "r31"]
jump_address_on_true = 0x821D6A68

[[midasm_hook]]
address = 0x821D6AEC
name = "EternalSonataPs3IconTexture"
registers = ["r4", "r10"]
after_instruction = true

[[midasm_hook]]
address = 0x821D6B8C
name = "EternalSonataPs3IconColour"
registers = ["r10", "r27", "r31"]

# Enemy records (ps3_enemies.cpp): the three readers of off_82024100 take the
# PS3's table, which has the new enemies.
[[midasm_hook]]
address = 0x821A0678
name = "EternalSonataPs3EnemyTable"
registers = ["r11"]
after_instruction = true

[[midasm_hook]]
address = 0x821BD4E4
name = "EternalSonataPs3EnemyTable"
registers = ["r11"]
after_instruction = true

[[midasm_hook]]
address = 0x821BD7C4
name = "EternalSonataPs3EnemyTable"
registers = ["r11"]
after_instruction = true

# Hit effects (ps3_hit_effects.cpp): the readers of unk_82078B00 take the
# PS3's table, which has records for the new enemies.
[[midasm_hook]]
address = 0x8218E490
name = "EternalSonataPs3HitEffectsR10"
registers = ["r10"]
after_instruction = true

[[midasm_hook]]
address = 0x8218E52C
name = "EternalSonataPs3HitEffectsR11"
registers = ["r11"]
after_instruction = true

[[midasm_hook]]
address = 0x8218E6CC
name = "EternalSonataPs3HitEffectsR10"
registers = ["r10"]
after_instruction = true
