"0x8228D440" = {}

# Names recovered from the PS3 build's RTTI table and transferred to the Xbox 360
# build by string anchoring. The 360 build has no RTTI, so every entry below is
# backed by a literal string the two builds share.
# Each was re-verified by decompilation.
# 0x822CCDB0 was named NAMEABLE_ITEM__SetName here. It is really strncpy, so it
# now lives in the [rexcrt] table at the bottom of this file and gets a native
# host implementation. Everything below that was justified as "calls SetName" is
# really just "calls strncpy"; see the warning on the batch 2-9 block.
"0x820CF140" = { name = "TEXTURE_LOT__GetInstance", evidence = "verified: lazy singleton on dword_82440564, allocates 112 bytes and tags it \"local alloc for texlot\"" }
# Verified genuine constructors by decompilation: both zero their fields, load a
# model, and SetName themselves with the matching literal. Their vtables
# (off_820831F8, off_82083200) pair them with the destructors in
# config/vtable_destructors.toml.
"0x82131668" = { name = "OP_CREDIT_TASK__ctor", evidence = "verified: zeroes its fields, loads op.bmd, installs vtable off_820831F8, names itself \"OP_CREDIT_TASK\" at +8" }
"0x821317F8" = { name = "ED_CREDIT_TASK__ctor", evidence = "verified: same shape, installs vtable off_82083200, names itself \"ED_CREDIT_TASK\" at +8" }
"0x82133130" = { name = "TITLE_TASK__Init", evidence = "verified: loads title.bmd, sets up the title camera and fade, names itself \"TITLE_TASK\" at +8" }

# ############################################################################
# Names verified by decompilation. Each carries its evidence.
#
# These are the survivors of a larger block generated from "94 SetName call
# sites". That premise was false: 0x822CCDB0 is strncpy, not a SetName method,
# so those were 94 strncpy call sites and the names hung off nothing. Sampling
# the guesses found 5 of 7 wrong outright. The rest of the block is commented
# out below; do not restore an entry without decompiling it first.
# ############################################################################
"0x820E64F0" = { name = "OBJECT__ctor", evidence = "verified: base constructor. Stores the OBJECT base vtable off_82082B60, zeroes +8/+16, then names the object from a3 or an auto-generated %08x counter" }
"0x820F91A8" = { name = "MEMORY_HEAP__Init", evidence = "verified: creates the \"Union HEAP\" and \"MapSE HEAP\" heaps via sub_82112240, plus several pool inits" }
"0x821A3888" = { name = "enemy_character_spawner", evidence = "verified: loops over *(a1+673) enemies, formats %03dbEnemy names, allocates each model via sub_82176398" }

# Was "tree_find". Verified wrong: it is a hash table insert/remove, not a tree
# and not a pure lookup. It hashes a name, walks a bucket chain (next at +24,
# prev at +20), then inserts a 32 byte entry when a3 is non null or unlinks the
# entry when a3 is zero, all under a lock.
"0x8210F050" = { name = "named_hashtable__SetEntry", evidence = "bucket chain walk + insert/unlink on a3, locked by sub_82109618/sub_82109670" }

# Was "dynamic_named_object__Init". Verified wrong: it strncpy's a 0x104 (MAX_PATH)
# string into a global and sets a flag. It is the {BeginCaptureFileCreation}
# handler in the PIX command table at 0x8226F450.
"0x8226F3B0" = { name = "PIX__SetCaptureFileName", evidence = "handler entry in the 0x8226F450 PIX command table; copies MAX_PATH name to byte_82426C80" }
# Was "pix_capture_logger". Verified wrong: it is the PIX command dispatcher. It
# builds a table of 8 command strings ({Connect}, {Disconnect}, {Version},
# {LimitCaptureSize}, {BeginCaptureFileCreation}, {EndCaptureFileCreation},
# {BeginCapture}, {EndCapture}) each paired with a handler, matches the input
# against them, invokes the handler, and reports "PIX!OK" or "PIX!NO".
"0x8226F450" = { name = "PIX__DispatchCommand", evidence = "8 entry command string/handler table, returns PIX!OK or PIX!NO" }
# Was "object_instance_factory". Verified wrong: it allocates via sub_822D1200,
# and on failure sets error code 63 plus an error string, then populates a three
# entry callback table at a2[0..2]. A callback table installer, not a factory.
"0x822985C0" = { name = "callback_table__Install", evidence = "fills a2[0..2] with sub_82298488/sub_82298520/sub_822985B8; error path sets code 63" }

# 0x820EE7D8 is deliberately left unnamed. It was labelled DIALOG_TEXT__utility
