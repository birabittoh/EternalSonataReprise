# Was "buffer_name_setup". Verified wrong: this is strncpy_s. It rejects sizes
# above 0x7FFFFFFF, strncpy's into the destination, force terminates the last
# byte, and returns 0, E_INVALIDARG (0x80070057) or ERROR_INSUFFICIENT_BUFFER
# (0x8007007A) depending on whether the source fit. Kept here rather than in
# [rexcrt]: the SDK's String group has strcpy_s but no strncpy_s, so mapping it
# there would just rename it and leave us owing an implementation. The guest_
# prefix avoids colliding with the host CRT declaration.
"0x82276410" = { name = "guest_strncpy_s", evidence = "strncpy + forced NUL + E_INVALIDARG/ERROR_INSUFFICIENT_BUFFER returns" }

