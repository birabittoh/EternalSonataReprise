# Twelve party slots: the per character arrays move to twelve wide copies
# (src/engine/party_arrays.cpp), reached through EternalSonataPartyRemap.

[address_remap]
handler = "EternalSonataPartyRemap"
# Each array out to its twelfth entry; keep in sync with kRanges.
ranges = [
  [0x8243FC08, 0x8243FC3C],  # position, slotbytes
  [0x8243FCFC, 0x8243FD08],  # charflags
  [0x8243FD08, 0x82440128],  # stats_live, stats_base, charwords
  [0x82016150, 0x820167B0],  # template
  [0x8202CA28, 0x8202CA54],  # camp portraits, two sets
  [0x82560114, 0x825601A2],  # shop stock list (shop_stock.cpp)
]
# Only listed functions are remapped; an unlisted one reads the stale retail
# copy. Regenerate with scripts/party_remap_functions.py.
