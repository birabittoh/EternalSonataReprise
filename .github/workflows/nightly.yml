name: Nightly

on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  NIGHTLY_TAG_PREFIX: nightly-
  NIGHTLY_RETENTION: ${{ vars.NIGHTLY_RETENTION || 10 }}
  RELEASE_LIST_LIMIT: 1000

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
      prev_nightly_sha: ${{ steps.tag.outputs.prev_nightly_sha }}
    steps:
      - name: Name the nightly and find the previous one
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "tag_name=${NIGHTLY_TAG_PREFIX}$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          prev=$(gh release list --limit "${RELEASE_LIST_LIMIT}" \
            --json tagName,isPrerelease,createdAt \
            | jq -r --arg prefix "${NIGHTLY_TAG_PREFIX}" \
                '[.[] | select(.isPrerelease) | select(.tagName | startswith($prefix))]
                  | sort_by(.createdAt) | last | .tagName // ""')
          prev_sha=""
          if [ -n "${prev}" ]; then
            prev_sha=$(gh release view "${prev}" --json targetCommitish -q .targetCommitish || echo "")
          fi
          echo "prev_nightly_sha=${prev_sha}" >> "$GITHUB_OUTPUT"

  # Artifact mode leaves ES_VERSION_NAME empty, so builds embed the newest v*
  # tag: the updater and mod version checks need a plain X.Y.Z.
  build:
    needs: prepare
    uses: ./.github/workflows/_build.yml
    with:
      publish_mode: artifact
      artifact_name: eternalsonata-${{ needs.prepare.outputs.tag_name }}
      # Loose pkg/ payloads would collide once merged into one release.
      upload_packages: true
    secrets: inherit

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      # Prerelease keeps it out of /releases/latest, which the self-updater polls.
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          PREV_SHA: ${{ needs.prepare.outputs.prev_nightly_sha }}
        run: |
          if [ -n "${PREV_SHA}" ] && git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
            header="Changes since the previous nightly (\`${PREV_SHA::7}\`):"
            commits=$(git log --no-merges --pretty='format:- %s (%h)' "${PREV_SHA}..${GITHUB_SHA}")
          else
            header="Latest commits on \`${GITHUB_REF_NAME}\`:"
            commits=$(git log --no-merges --pretty='format:- %s (%h)' -20 "${GITHUB_SHA}")
          fi
          notes=$(printf '%s\n\n%s\n' "${header}" "${commits:-- (no new commits)}")
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --notes "${notes}" --prerelease
            gh release upload "${TAG_NAME}" release-assets/* --clobber
          else
            gh release create "${TAG_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "Nightly ${TAG_NAME#"${NIGHTLY_TAG_PREFIX}"}" \
              --notes "${notes}" \
              --prerelease \
              release-assets/*
          fi

      - name: Prune old nightlies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit "${RELEASE_LIST_LIMIT}" \
            --json tagName,isPrerelease,createdAt \
            | jq -r --arg prefix "${NIGHTLY_TAG_PREFIX}" --argjson keep "${NIGHTLY_RETENTION}" \
                '[.[] | select(.isPrerelease) | select(.tagName | startswith($prefix))]
                  | sort_by(.createdAt) | reverse | .[$keep:] | .[].tagName' \
            | while IFS= read -r tag; do
                [ -z "${tag}" ] && continue
                echo "Pruning ${tag}"
                gh release delete "${tag}" --yes --cleanup-tag
              done
