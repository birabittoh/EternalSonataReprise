name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  launcher-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure transaction tests (no game data required)
        run: cmake -S tests -B out/launcher-tests
      - name: Build transaction tests
        run: cmake --build out/launcher-tests --config Release
      - name: Test content preparation
        run: ctest --test-dir out/launcher-tests -C Release --output-on-failure

  prepare:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
      date_hhmm: ${{ steps.sha.outputs.date_hhmm }}
    steps:
      - name: Get short SHA and timestamp
        id: sha
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date_hhmm=$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/_build.yml
    with:
      publish_mode: artifact
      artifact_name: eternalsonata-${{ needs.prepare.outputs.date_hhmm }}-${{ needs.prepare.outputs.short_sha }}
    secrets: inherit
