name: Build eternalsonata

on:
  workflow_call:
    inputs:
      publish_mode:
        description: "'artifact' for CI workflow-artifact, 'release' for GitHub release"
        required: true
        type: string
      artifact_name:
        description: "Artifact name prefix when publish_mode is 'artifact'"
        required: false
        type: string
        default: ""
      tag:
        description: "Release tag to embed in release artifact filenames"
        required: false
        type: string
        default: ""
env:
  ASSETS_REPO: ${{ vars.ASSETS_REPO }}
  ASSET_PATH: default.xex
  ASSET_CACHE_KEY: codegen-assets-v1

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            sdk_dir: win-amd64
            artifact_suffix: windows-x64

          - platform: linux-x64
            runner: ubuntu-latest
            sdk_dir: linux-amd64
            artifact_suffix: linux-x64

          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            sdk_dir: linux-arm64
            artifact_suffix: linux-arm64

          - platform: mac-amd64
            runner: macos-26-intel
            sdk_dir: mac-amd64
            artifact_suffix: mac-amd64

          - platform: mac-arm64
            runner: macos-26
            sdk_dir: mac-arm64
            artifact_suffix: mac-arm64

          - platform: android-arm64
            runner: ubuntu-latest
            # Host SDK for codegen (runs natively on x86_64 Linux)
            sdk_dir: linux-amd64
            # Target SDK for cross-compile (Android ARM64 libraries)
            target_sdk_dir: android-arm64
            artifact_suffix: android-arm64
            ndk_version: "27.0.12077973"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # The Android versionCode/versionName come from the newest reachable
          # v* tag, which a default shallow checkout does not fetch.
          fetch-tags: true
          fetch-depth: 0

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y ninja-build libgtk-3-dev libx11-xcb-dev libsdl2-dev

      - name: Install dependencies (Android)
        if: matrix.platform == 'android-arm64'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y ninja-build

      - name: Install dependencies (macOS)
        if: startsWith(matrix.platform, 'mac-')
        run: brew install cmake ninja vulkan-loader molten-vk

      # Xcode 26's `metal` compiler lives in a separate, opt-in component;
      # HLSL-to-metallib shader compilation needs it installed explicitly.
      - name: Install Metal Toolchain (macOS)
        if: startsWith(matrix.platform, 'mac-')
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Install LLVM, CMake, Ninja (Windows)
        if: matrix.platform == 'windows'
        run: choco install llvm cmake ninja -y

      - name: Set up Android NDK
        if: matrix.platform == 'android-arm64'
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        if: matrix.platform == 'android-arm64'
        run: |
          sdkmanager --install "ndk;${{ matrix.ndk_version }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ matrix.ndk_version }}" >> "$GITHUB_ENV"

      - name: Set up JDK 17 (Android)
        if: matrix.platform == 'android-arm64'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (Android)
        if: matrix.platform == 'android-arm64'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: ${{ matrix.platform }}

      # download-sdk.py authenticates its GitHub API calls with this token so
      # the 6 parallel matrix legs share the 5000/hour authenticated rate
      # limit instead of the 60/hour unauthenticated one, which a burst of
      # simultaneous requests from the runner IPs could exhaust on its own.
      - name: Download ReXGlue SDK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/download-sdk.py sdk/${{ matrix.sdk_dir }} --pinned

      - name: Download ReXGlue SDK (Android target)
        if: matrix.target_sdk_dir
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/download-sdk.py sdk/${{ matrix.target_sdk_dir }} --pinned --platform ${{ matrix.target_sdk_dir }}

      # Ninja re-invokes codegen using the SDK CMAKE_PREFIX_PATH points at,
      # which here is the Android target SDK's ARM64 rexglue, built for the
      # device. rexglue is build-only tooling, so swap in the host binary
      # here. Its librexruntime.so dependency comes from LD_LIBRARY_PATH on
      # the build step below, keeping the target SDK's own arm64 runtime
      # libraries in place.
      - name: Use host rexglue for codegen in the Android target SDK
        if: matrix.target_sdk_dir
        shell: bash
        run: cp sdk/${{ matrix.sdk_dir }}/bin/rexglue sdk/${{ matrix.target_sdk_dir }}/bin/rexglue

      - name: Install Python build dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Cache XEX asset for codegen
        id: asset-cache
        uses: actions/cache@v5
        with:
          path: assets/${{ env.ASSET_PATH }}
          key: ${{ env.ASSET_CACHE_KEY }}

      # On a cold cache all 6 matrix legs hit the assets repo's contents API
      # at once, and the burst can trip a 403 on whichever request lands
      # last. Retry with a backoff rather than serialising the legs.
      - name: Fetch XEX asset
        if: steps.asset-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        shell: bash
        run: |
          mkdir -p assets
          for attempt in 1 2 3 4 5; do
            if gh api -H "Accept: application/vnd.github.raw" \
                 "repos/${{ env.ASSETS_REPO }}/contents/${{ env.ASSET_PATH }}" \
                 > "assets/${{ env.ASSET_PATH }}"; then
              break
            fi
            echo "Attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          size=$(wc -c < "assets/${{ env.ASSET_PATH }}")
          echo "Fetched ${{ env.ASSET_PATH }} ($size bytes)"
          [ "$size" -ge 1048576 ] || { echo "Asset too small, fetch likely failed"; exit 1; }

      - name: Build (desktop)
        if: matrix.platform != 'android-arm64'
        shell: bash
        run: python scripts/build.py --release --sdk-dir sdk/${{ matrix.sdk_dir }}

      # Android: codegen runs on the host SDK, then cross-compile with NDK
      # against the Android target SDK.
      - name: Run codegen (Android)
        if: matrix.platform == 'android-arm64'
        shell: bash
        run: |
          sdk/${{ matrix.sdk_dir }}/bin/rexglue codegen eternalsonata_manifest.toml
          sed -i 's/^sdk_version = .*/sdk_version = ""/' eternalsonata_manifest.toml

      - name: CMake configure (Android)
        if: matrix.platform == 'android-arm64'
        shell: bash
        run: |
          cmake --preset android-arm64-release \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK_HOME" \
            -DCMAKE_PREFIX_PATH=sdk/${{ matrix.target_sdk_dir }} \
            -DCMAKE_FIND_ROOT_PATH="$PWD/sdk/${{ matrix.target_sdk_dir }}" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: CMake build (Android)
        if: matrix.platform == 'android-arm64'
        shell: bash
        # Lets the host rexglue swapped into the target SDK's bin/ (see step
        # above) find its librexruntime.so, without a copy near the arm64 one.
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/${{ matrix.sdk_dir }}/bin:${{ github.workspace }}/sdk/${{ matrix.sdk_dir }}/lib
        run: cmake --build --preset android-arm64-release --parallel $(nproc)

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Package (desktop)
        if: matrix.platform != 'android-arm64' && !startsWith(matrix.platform, 'mac-')
        shell: bash
        run: |
          if [ "${{ inputs.publish_mode }}" = "artifact" ]; then
            out="${{ inputs.artifact_name }}-${{ matrix.artifact_suffix }}"
          else
            out="eternalsonata-${{ inputs.tag }}-${{ matrix.artifact_suffix }}"
          fi
          python scripts/build.py --package "${out}"

      # macOS gets a .app inside a .dmg rather than a tar.gz: the Vulkan
      # runtime has to be bundled (there is none on macOS by default), and a
      # disk image is what lets the user drag the app out to /Applications,
      # which is also what frees it from App Translocation. See
      # scripts/package-mac.py.
      - name: Package (macOS)
        if: startsWith(matrix.platform, 'mac-')
        shell: bash
        run: |
          if [ "${{ inputs.publish_mode }}" = "artifact" ]; then
            out="${{ inputs.artifact_name }}-${{ matrix.artifact_suffix }}"
            version="0.0.0"
          else
            out="eternalsonata-${{ inputs.tag }}-${{ matrix.artifact_suffix }}"
            version="$(echo "${{ inputs.tag }}" | sed 's/^v//')"
          fi
          python scripts/package-mac.py --name "${out}" --version "${version}"

      - name: Generate Android launcher icon
        if: matrix.platform == 'android-arm64'
        shell: bash
        run: python -m pip install --disable-pip-version-check Pillow && python scripts/gen-android-icon.py

      # Without this the APK is debug-signed with the runner's throwaway key,
      # so it cannot be installed over a locally built one (and vice versa)
      # without uninstalling first, which drops saves and extracted game data.
      - name: Restore sideload signing keystore (Android)
        if: matrix.platform == 'android-arm64'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ES_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ES_KEYSTORE_BASE64 is not set; the APK will be debug-signed and will not install over a sideload-signed build."
            exit 0
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/sideload.jks
          echo "Restored android/keystore/sideload.jks ($(wc -c < android/keystore/sideload.jks) bytes)"

      - name: Package (Android)
        if: matrix.platform == 'android-arm64'
        shell: bash
        env:
          # Empty for CI artifact builds, where Gradle falls back to the newest
          # reachable tag.
          ES_VERSION_NAME: ${{ inputs.tag }}
          ES_KEYSTORE_PASSWORD: ${{ secrets.ES_KEYSTORE_PASSWORD }}
          ES_KEY_ALIAS: ${{ secrets.ES_KEY_ALIAS }}
          ES_KEY_PASSWORD: ${{ secrets.ES_KEY_PASSWORD }}
        run: |
          if [ "${{ inputs.publish_mode }}" = "artifact" ]; then
            name="${{ inputs.artifact_name }}-${{ matrix.artifact_suffix }}"
          else
            name="eternalsonata-${{ inputs.tag }}-${{ matrix.artifact_suffix }}"
          fi

          BUILD_DIR="$PWD/out/build/android-arm64-release"
          JNI_DIR="$PWD/android/app/jniLibs/arm64-v8a"
          ASSETS_DIR="$PWD/android/app/assets"
          mkdir -p "$JNI_DIR" "$ASSETS_DIR"

          # Stage the project's own shared library.
          cp -v "$BUILD_DIR/libeternalsonata.so" "$JNI_DIR/"

          # Stage SDK runtime libraries (release variants only).
          for lib in sdk/${{ matrix.target_sdk_dir }}/lib/*.so; do
            base=$(basename "$lib")
            # Skip debug ("d") and relwithdebinfo ("rd") variants.
            case "$base" in
              *rd.so) continue ;;
              *d.so)  continue ;;
            esac
            # Skip DXC — build-time shader compiler, not a runtime dependency.
            case "$base" in
              libdxcompiler*|libdxil*) continue ;;
            esac
            cp -v "$lib" "$JNI_DIR/"
          done

          # Stage the guest shader pack as an Android asset.
          # This is generated by gen-guest-shaders.py during the cmake build
          # (the eternalsonata target depends on eternalsonata_guest_shaders).
          # Without it the game renders a black screen.
          cp -v "$BUILD_DIR/guest_shaders.bin" "$ASSETS_DIR/"

          echo "=== Staged jniLibs ==="
          ls -lh "$JNI_DIR/"
          echo "=== Staged assets ==="
          ls -lh "$ASSETS_DIR/" 2>/dev/null || echo "(none)"

          # Signed with the sideload key when the keystore was restored above,
          # otherwise debug-signed.
          cd android
          gradle assembleRelease --no-daemon

          # Locate the built APK and stage it for upload.
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          mkdir -p ../pkg
          cp "$APK" "../pkg/${name}.apk"
          echo "ARTIFACT_PATH=pkg/${name}.apk" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${name}" >> "$GITHUB_ENV"

      - name: Upload CI artifact
        if: inputs.publish_mode == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: pkg/
          if-no-files-found: error

      - name: Upload release artifact
        if: inputs.publish_mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
